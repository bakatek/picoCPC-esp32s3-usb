; PicoCPC USB Bridge - ESP32-S3 DevKitC-1 N16R8 (16 Mo flash QIO, 8 Mo PSRAM octale)
; Prevu pour la plateforme espressif32 6.9.0 (Arduino-ESP32 2.0.17).

[env:picocpc_bridge]
platform  = espressif32@6.9.0
board     = esp32-s3-devkitc-1
framework = arduino

; N16R8 = flash 16 Mo (QIO) + PSRAM octale (OPI) 8 Mo
board_build.arduino.memory_type = qio_opi
board_build.flash_mode  = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions  = partitions.csv

; flash et console : port "UART" de la carte
upload_speed  = 921600
monitor_speed = 115200

; ARDUINO_USB_MODE=0 : USB OTG (TinyUSB) sur le port "USB", necessaire pour MSC + HID
; ARDUINO_USB_CDC_ON_BOOT=0 : pas de port serie USB, Serial reste sur le port UART
build_flags =
  -UARDUINO_USB_MODE
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1

lib_deps =
  h2zero/NimBLE-Arduino@^1.4.2
  links2004/WebSockets@^2.4.1

extra_scripts = post:copy_firmware.py